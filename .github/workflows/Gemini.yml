
name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pocket AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJ: work

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          ZIP="pocket-ai-android-project.zip"
          test -f "$ZIP"
          unzip -o "$ZIP" -d work

          test -f work/settings.gradle.kts
          test -f work/build.gradle.kts
          test -f work/app/build.gradle.kts
          test -f work/app/src/main/AndroidManifest.xml
          test -f work/app/src/main/cpp/CMakeLists.txt

      - name: Configure Gradle
        run: |
          cat > work/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.code.style=official
          EOF

          find work -exec touch -c {} +
          rm -rf work/app/.cxx work/app/build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Verify environment
        run: |
          java -version
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/26.3.11579264"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Prepare llama.cpp
        run: |
          DIR="work/app/src/main/cpp/llama.cpp"
          if [ ! -f "$DIR/CMakeLists.txt" ]; then
            mkdir -p "$(dirname "$DIR")"
            git clone --depth 1 --branch v1.0.0 \
              https://github.com/ggml-org/llama.cpp.git "$DIR"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests
        working-directory: work
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build APK
        working-directory: work
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        run: |
          set -e
          APK="work/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-debug-apk
          path: work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocket AI Build ${{ github.run_number }}
          files: work/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-build-logs
          path: |
            build.log
            test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo '```text'
            grep -n -E -B3 -A8 \
              'What went wrong|CMake Error|error:|fatal:|FAILED|^e: ' \
              build.log test.log 2>/dev/null | tail -160 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
