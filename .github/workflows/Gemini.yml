
name: Pocket AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: pocket-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pocket AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="pocket-ai-android-project.zip"

          test -f "$ZIP" || {
            echo "::error::Missing $ZIP"
            ls -lah
            exit 1
          }

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP" -d project

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/cpp/CMakeLists.txt

          echo "Project structure verified."

      - name: Configure Gradle Properties
        run: |
          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.code.style=official
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate or Install Android Command-line Tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools."

            TMP_DIR="$(mktemp -d)"
            curl -fsSL \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o "$TMP_DIR/cmdline-tools.zip"

            mkdir -p "$TMP_DIR/unpacked"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/unpacked"

            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"

            cp -a "$TMP_DIR/unpacked/cmdline-tools/." \
              "$SDK_ROOT/cmdline-tools/latest/"

            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          echo "Android SDK installed."
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

          echo "Build environment verified."

      - name: Run Unit Tests
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/unit-tests.log"

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/debug-build.log"

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease \
            --no-daemon --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"

      - name: Verify APK Outputs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="project/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="project/app/build/outputs/apk/release"

          test -s "$DEBUG_APK"

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          if [ -d "$RELEASE_DIR" ]; then
            find "$RELEASE_DIR" -maxdepth 1 \
              -type f -name '*.apk' -size +0c -print
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-AI-Debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-AI-Release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-AI-Build-Logs
          path: |
            unit-tests.log
            debug-build.log
            release-build.log
          if-no-files-found: ignore
          retention-days: 7
