name: Auto-Unzip & Build Pocket AI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract PocketAI-Android-Source.zip if present
        run: |
          if [ -f "PocketAI-Android-Source.zip" ]; then
            unzip -o PocketAI-Android-Source.zip
            cp -rf PocketAI/. .
            rm -rf PocketAI
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v4
        with:
          packages: |
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Run unit tests & build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
