name: Build Pocket AI APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unzip project archive
        run: |
          set -e
          mkdir -p work/PocketAI
          if [ -f "PocketAI-Android-Source.zip" ]; then
            unzip -o PocketAI-Android-Source.zip -d work/
          elif [ -f "pocket-ai-android-project.zip" ]; then
            unzip -o pocket-ai-android-project.zip -d work/
          else
            echo "ERROR: No project zip found in repository root."
            ls -la
            exit 1
          fi
          if [ -d "work/PocketAI/PocketAI" ]; then
            mv work/PocketAI/PocketAI/* work/PocketAI/ || true
          fi
          ls -la work/PocketAI

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        working-directory: work/PocketAI
        run: |
          set -e
          gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketAI-debug-apk
          path: work/PocketAI/app/build/outputs/apk/debug/*.apk
