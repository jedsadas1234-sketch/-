name: build-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # create Release with the APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJ: work/PocketAI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The repo holds the project as a .zip. Use the newest-named zip, fresh each run.
      - name: Unzip project
        run: |
          rm -rf work && mkdir -p work
          ZIP="$(ls ./*.zip | sort -V | tail -1)"
          echo "Using: $ZIP"
          unzip -q -o "$ZIP" -d work
          test -f "$PROJ/app/build.gradle.kts"

      # ROOT CAUSE FIX. zip stores local time with no timezone; unzip on a UTC runner
      # gives files dated hours in the FUTURE. build.ninja is then always older than
      # CMakeLists.txt, so ninja re-runs CMake until "still dirty after 100 tries".
      - name: Fix future-dated timestamps and clean native dirs
        run: |
          echo "future-dated files before fix: $(find work -newermt now | wc -l)"
          find work -exec touch -c {} +
          echo "future-dated files after fix:  $(find work -newermt now | wc -l)"
          rm -rf "$PROJ/app/.cxx" "$PROJ/app/build"

      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Clone llama.cpp v1.0.0
        run: |
          D="$PROJ/app/src/main/cpp/llama.cpp"
          [ -f "$D/CMakeLists.txt" ] || git clone --depth 1 --branch v1.0.0 https://github.com/ggml-org/llama.cpp.git "$D"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        run: |
          touch build.log
          {
            echo '### Build errors'
            echo '```'
            grep -n -E -B3 -A10 'What went wrong|CMake Error|error:|fatal:|FAILED|^e: ' build.log | head -120
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # If it still loops, this names the exact input that keeps build.ninja dirty.
      - name: Diagnose build.ninja loop
        if: failure()
        working-directory: ${{ env.PROJ }}
        run: |
          NINJA="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          for d in app/.cxx/*/*/arm64-v8a; do
            echo "=== $d ==="
            "$NINJA" -C "$d" -d explain pocketai_llm 2>&1 | grep -m10 -E "older than|dirty|missing" || true
            "$NINJA" -C "$d" -t query build.ninja 2>/dev/null | grep -E '^\s+/' \
              | xargs -r stat -c '%y  %n' | sort | tail -5
            echo "now: $(date '+%F %T %z')"
          done

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PocketAI-debug-apk
          path: work/PocketAI/app/build/outputs/apk/debug/app-debug.apk

      # APK in Releases: downloadable straight from the phone, no zip to unpack
      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: work/PocketAI/app/build/outputs/apk/debug/app-debug.apk
